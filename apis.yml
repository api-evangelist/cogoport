aid: cogoport
name: Cogoport
description: 'Cogoport is a global logistics and supply chain platform offering freight
  booking, customs, trade finance, and supply chain visibility for businesses across
  ocean, air, and inland transport. It provides ocean (FCL and LCL) and air freight
  booking with real-time rate discovery, customs clearance and compliance support,
  trade finance including invoice financing and pay-later solutions, end-to-end shipment
  tracking, and logistics tools such as an HS Code Finder, container trackers, and
  shipping cost calculators. Cogoport is backed by Accel and headquartered in India,
  serving importers and exporters worldwide.'
